[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegean-licensing"
version = "0.1.0"
description = "Official licensing framework, commercial agreements, and certificate tooling for AegeanWorks"
authors = [
    { name = "AegeanWorks", email = "aegean-licensing@proton.me" }
]
license = "LicenseRef-AL-1.1"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["licensing", "source-available", "acl", "compliance", "certificates"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
aegean-license = "aegean_licensing.cli:main"

[tool.setuptools]
packages = ["aegean_licensing"]
