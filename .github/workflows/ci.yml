name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover tests -v

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite
        run: python -m unittest discover tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel . --no-deps -w dist
      - name: Verify the wheel ships the legal documents
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          required = [
              "aegean_licensing/resources/licenses/ACL-1.0.md",
              "aegean_licensing/resources/licenses/AL-1.0.md",
              "aegean_licensing/resources/licenses/RESTRICTED-NOTICE.md",
              "aegean_licensing/resources/licenses/PRIVACY.md",
              "aegean_licensing/resources/policies/PORTFOLIO-MIGRATION-PLAN.md",
              "aegean_licensing/resources/.github/workflows/cla-check.yml",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit(f"Wheel is missing bundled documents: {missing}")
          print(f"{wheel} ships {len(required)} required documents.")
          PY
      - name: Install and smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -m aegean_licensing --version
          python -m aegean_licensing verify --help > /dev/null
          python -c "from aegean_licensing.license_terms import load_registry, terms_digest; terms_digest(load_registry()['ACL-1.0'])"
